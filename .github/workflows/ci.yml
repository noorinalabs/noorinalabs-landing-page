name: CI

on:
  push:
    branches: [main, "deployments/**"]
  pull_request:
    branches: [main, "deployments/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@noorinalabs"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,astro,css,md,json}"

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@noorinalabs"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test --project=desktop-chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  dockerfile-base-pin:
    name: Dockerfile base-image pinning lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Charter-prose→code gate (noorinalabs-main#735/#744, tech-decisions.md
      # § Base Image Pinning). Asserts every Dockerfile FROM is digest-pinned
      # (image:tag@sha256:<digest>) AND carries the matching distro upgrade.
      # Mirrors the `dockerfile-base-pin` pre-commit hook (the sync-drift gate
      # classifies the kind, so the mirror is mandatory). Lives in ci.yml (not
      # docs.yml) so it has no path filter — a Dockerfile-only edit still gates.
      - name: dockerfile-base-pin — Dockerfile FROM digest-pin + distro upgrade
        run: |
          files=$(find . \( -path ./node_modules -o -path ./dist -o -path ./.astro \
            -o -path ./.claude/worktrees \) -prune -o \
            \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.dockerfile' \) -print)
          if [ -z "$files" ]; then
            echo "No Dockerfiles found — base-pin lint is a no-op here."
            exit 0
          fi
          # shellcheck disable=SC2086  # word-splitting is intended (one path per arg)
          python3 scripts/check_dockerfile_base_pin.py $files
